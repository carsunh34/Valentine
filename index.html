<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elisa, I Have a Question... 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #e63956;
    --rose-dark: #c42d47;
    --rose-light: #ff6b8a;
    --blush: #fff0f3;
    --cream: #fffaf5;
    --pink-glow: rgba(230, 57, 86, 0.25);
    --gold: #f5c26b;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    min-height: 100dvh;
    overflow: hidden;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ── Animated gradient background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255, 182, 193, 0.45) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255, 105, 135, 0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 90%, rgba(245, 194, 107, 0.15) 0%, transparent 50%),
      linear-gradient(160deg, #fff5f7 0%, #ffe8ee 40%, #fff0f3 70%, #fffaf5 100%);
    z-index: 0;
    animation: bgShift 8s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0% { opacity: 1; }
    100% { opacity: 0.85; }
  }

  /* ── Floating hearts background ── */
  .hearts-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .floating-heart {
    position: absolute;
    font-size: 1.2rem;
    opacity: 0;
    animation: floatUp linear infinite;
    color: var(--rose-light);
    filter: blur(0.5px);
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) rotate(0deg) scale(0.5);
      opacity: 0;
    }
    10% { opacity: 0.25; }
    90% { opacity: 0.15; }
    100% {
      transform: translateY(-10vh) rotate(360deg) scale(1.2);
      opacity: 0;
    }
  }

  /* ── Main card ── */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 200, 210, 0.5);
    border-radius: 32px;
    padding: 3rem 2.5rem 2.5rem;
    max-width: 460px;
    width: 90vw;
    text-align: center;
    box-shadow:
      0 4px 30px rgba(230, 57, 86, 0.08),
      0 1px 3px rgba(0, 0, 0, 0.04);
    animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cardIn {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Heading ── */
  .heading {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    color: var(--rose);
    line-height: 1.4;
    margin-bottom: 1.5rem;
    animation: headingIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    text-shadow: 0 2px 15px rgba(230, 57, 86, 0.15);
  }

  @keyframes headingIn {
    0% { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ── GIF container ── */
  .gif-container {
    width: 220px;
    height: 220px;
    margin: 0 auto 2rem;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(230, 57, 86, 0.12);
    animation: gifIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    border: 3px solid rgba(255, 200, 210, 0.5);
    position: relative;
    background: var(--blush);
  }

  .gif-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.4s ease;
  }

  @keyframes gifIn {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ── Buttons ── */
  .buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    align-items: center;
    animation: buttonsIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    min-height: 60px;
  }

  @keyframes buttonsIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .btn-yes {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 14px 40px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-light) 100%);
    color: #fff;
    box-shadow:
      0 4px 15px var(--pink-glow),
      0 0 0 0 rgba(230, 57, 86, 0.3);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    letter-spacing: 0.3px;
  }

  .btn-yes:hover {
    transform: scale(1.08);
    box-shadow:
      0 6px 25px rgba(230, 57, 86, 0.35),
      0 0 0 4px rgba(230, 57, 86, 0.12);
  }

  .btn-yes:active {
    transform: scale(1.02);
  }

  /* Shimmer on yes button */
  .btn-yes::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -75%;
    width: 50%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { left: -75%; }
    50% { left: 125%; }
  }

  .btn-no {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 12px 28px;
    border: 2px solid rgba(230, 57, 86, 0.2);
    border-radius: 50px;
    cursor: pointer;
    background: rgba(255, 240, 243, 0.8);
    color: var(--rose);
    transition: transform 0s, opacity 0.3s, font-size 0.3s;
    position: fixed;
    z-index: 100;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
  }

  .btn-no.shaking {
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-2deg); }
    40% { transform: translateX(4px) rotate(2deg); }
    60% { transform: translateX(-3px) rotate(-1deg); }
    80% { transform: translateX(3px) rotate(1deg); }
  }

  /* ── Hover counter ── */
  .hover-counter {
    font-size: 0.8rem;
    color: rgba(230, 57, 86, 0.45);
    margin-top: 1.2rem;
    min-height: 1.2rem;
    transition: opacity 0.3s;
    font-weight: 500;
  }

  /* ── Speech bubble ── */
  .speech-bubble {
    position: fixed;
    z-index: 101;
    background: white;
    color: var(--rose);
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 8px 14px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    pointer-events: none;
    animation: bubbleIn 0.3s ease-out, bubbleOut 0.3s ease-in 1s forwards;
    white-space: nowrap;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 2px;
    transform: translateX(-50%) rotate(45deg);
  }

  @keyframes bubbleIn {
    0% { opacity: 0; transform: translateY(5px) scale(0.8); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes bubbleOut {
    0% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-10px); }
  }

  /* ── Celebration state ── */
  .celebration-text {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.4rem, 4.5vw, 2rem);
    color: var(--rose);
    line-height: 1.4;
    margin-bottom: 1.5rem;
    text-shadow: 0 2px 15px rgba(230, 57, 86, 0.15);
  }

  .final-message {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--rose-dark);
    opacity: 0.7;
    margin-top: 0.5rem;
  }

  .fade-in {
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeIn {
    0% { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
  }

  .bounce-in {
    animation: bounceIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.3); }
    50% { opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ── Mobile adjustments ── */
  @media (max-width: 500px) {
    .card {
      padding: 2rem 1.5rem 2rem;
      border-radius: 24px;
    }
    .gif-container {
      width: 180px;
      height: 180px;
    }
    .btn-yes {
      padding: 12px 32px;
      font-size: 1.05rem;
    }
  }
</style>
</head>
<body>

<!-- Floating hearts background -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- Main card -->
<div class="card" id="card">
  <!-- ASK STATE -->
  <div id="askState">
    <h1 class="heading">Elisa, Will You Be My Valentine?</h1>
    <div class="gif-container">
      <img
        id="askGif"
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzRqMnc3dGZiOWt5OHIwOHpkdmFwazdsem5iNmtjajk0dGx3NDB3YiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/TRgyI2f0hRHBS/giphy.gif"
        alt="Puppy with pleading eyes"
        loading="eager"
      >
    </div>
    <div class="buttons">
      <button class="btn-yes" id="btnYes" onclick="sayYes()">Yes! 💖</button>
    </div>
    <div class="hover-counter" id="hoverCounter"></div>
  </div>

  <!-- CELEBRATION STATE (hidden) -->
  <div id="celebrationState" style="display:none;">
    <h1 class="celebration-text bounce-in">I knew you'd say yes! 🥰</h1>
    <div class="gif-container fade-in">
      <img
        id="celebGif"
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNjRxaGRndWhzcHoxZmg4cHR5NXM5dGlkNGxkYjhjcjE2ZnltcjVkdCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/XbxZ41fWLeRECPsGIJ/giphy.gif"
        alt="Celebration!"
        loading="lazy"
      >
    </div>
    <p class="final-message fade-in">Happy Valentine's Day, Elisa ❤️</p>
  </div>
</div>

<!-- The No button lives outside the card so it can teleport freely -->
<button class="btn-no" id="btnNo">No</button>

<script>
  // ── Floating hearts ──
  const heartsBg = document.getElementById('heartsBg');
  const heartChars = ['♥', '♡', '❤', '💕'];

  function createHeart() {
    const heart = document.createElement('span');
    heart.classList.add('floating-heart');
    heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
    heart.style.animationDuration = (6 + Math.random() * 8) + 's';
    heart.style.animationDelay = Math.random() * 2 + 's';
    heartsBg.appendChild(heart);
    setTimeout(() => heart.remove(), 16000);
  }

  // Start hearts
  for (let i = 0; i < 8; i++) setTimeout(createHeart, i * 400);
  setInterval(createHeart, 1500);

  // ── No Button Logic ──
  const btnNo = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');
  const hoverCounter = document.getElementById('hoverCounter');
  let hoverCount = 0;
  let isHidden = false;

  const speechBubbles = [
    "Nope! 😏", "Can't catch me!", "Try the other one →",
    "I'm too fast!", "Hehe 😜", "Almost! ...not really",
    "Why would you even?!", "Wrong choice, buddy",
    "I believe in you... to click Yes", "🏃💨"
  ];

  const noTextStages = [
    { count: 0, text: "No" },
    { count: 5, text: "Are you sure?" },
    { count: 10, text: "Please don't 🥺" },
    { count: 15, text: "Just say yes!" },
    { count: 18, text: "..." },
  ];

  function getNoText() {
    let text = "No";
    for (const stage of noTextStages) {
      if (hoverCount >= stage.count) text = stage.text;
    }
    return text;
  }

  function getScale() {
    if (hoverCount >= 13) return 0.5;
    if (hoverCount >= 7) return 0.65;
    if (hoverCount >= 3) return 0.8;
    return 1;
  }

  function getOpacity() {
    if (hoverCount >= 15) return 0.15;
    if (hoverCount >= 13) return 0.4;
    return 1;
  }

  function positionNoButton() {
    const btnRect = btnNo.getBoundingClientRect();
    const yesRect = btnYes.getBoundingClientRect();
    const pad = 20;
    const w = btnRect.width || 100;
    const h = btnRect.height || 44;
    let x, y, attempts = 0;

    do {
      x = pad + Math.random() * (window.innerWidth - w - pad * 2);
      y = pad + Math.random() * (window.innerHeight - h - pad * 2);
      attempts++;
    } while (
      attempts < 30 &&
      x < yesRect.right + 20 && x + w > yesRect.left - 20 &&
      y < yesRect.bottom + 20 && y + h > yesRect.top - 20
    );

    btnNo.style.left = x + 'px';
    btnNo.style.top = y + 'px';
  }

  function showSpeechBubble() {
    const rect = btnNo.getBoundingClientRect();
    const bubble = document.createElement('div');
    bubble.classList.add('speech-bubble');
    bubble.textContent = speechBubbles[Math.floor(Math.random() * speechBubbles.length)];
    bubble.style.left = (rect.left + rect.width / 2) + 'px';
    bubble.style.top = (rect.top - 40) + 'px';
    bubble.style.transform = 'translateX(-50%)';
    document.body.appendChild(bubble);
    setTimeout(() => bubble.remove(), 1400);
  }

  function evadeNo() {
    hoverCount++;

    // Update text
    btnNo.textContent = getNoText();

    // Update scale & opacity
    const scale = getScale();
    const opacity = getOpacity();
    btnNo.style.transform = `scale(${scale})`;
    btnNo.style.opacity = opacity;

    // Shake at stage 7+
    if (hoverCount >= 7 && hoverCount < 13) {
      btnNo.classList.add('shaking');
      setTimeout(() => btnNo.classList.remove('shaking'), 400);
    }

    // Speech bubble every 2-3 hovers
    if (hoverCount % 3 === 0) {
      showSpeechBubble();
    }

    // Disappear mechanic at 18+
    if (hoverCount >= 18 && !isHidden) {
      isHidden = true;
      btnNo.style.opacity = '0';
      btnNo.style.pointerEvents = 'none';
      setTimeout(() => {
        positionNoButton();
        btnNo.style.opacity = '0.15';
        btnNo.style.pointerEvents = 'auto';
        btnNo.style.transform = 'scale(0.4)';
        isHidden = false;
      }, 2000);
      return;
    }

    // Teleport
    positionNoButton();

    // Update hover counter
    if (hoverCount >= 3) {
      hoverCounter.textContent = `The "No" button has run away ${hoverCount} times 😤`;
    }
  }

  // Event listeners for No button
  btnNo.addEventListener('mouseenter', evadeNo);
  btnNo.addEventListener('touchstart', (e) => {
    e.preventDefault();
    evadeNo();
  }, { passive: false });

  // Also prevent actual click
  btnNo.addEventListener('click', (e) => {
    e.preventDefault();
    evadeNo();
  });

  // Initial position
  function initNoButton() {
    // Position it next to the yes button initially
    const yesRect = btnYes.getBoundingClientRect();
    btnNo.style.left = (yesRect.right + 16) + 'px';
    btnNo.style.top = (yesRect.top + (yesRect.height - btnNo.offsetHeight) / 2) + 'px';
  }

  // Wait for layout
  setTimeout(initNoButton, 900);

  // ── Yes Button / Celebration ──
  function sayYes() {
    // Hide ask state
    document.getElementById('askState').style.display = 'none';
    btnNo.style.display = 'none';

    // Show celebration
    document.getElementById('celebrationState').style.display = 'block';

    // Confetti burst!
    const duration = 4000;
    const end = Date.now() + duration;

    const colors = ['#e63956', '#ff6b8a', '#f5c26b', '#ff85a1', '#fff0f3', '#ff3366'];

    (function frame() {
      confetti({
        particleCount: 3,
        angle: 60,
        spread: 65,
        origin: { x: 0, y: 0.7 },
        colors: colors,
      });
      confetti({
        particleCount: 3,
        angle: 120,
        spread: 65,
        origin: { x: 1, y: 0.7 },
        colors: colors,
      });

      if (Date.now() < end) {
        requestAnimationFrame(frame);
      }
    }());

    // Big center burst
    setTimeout(() => {
      confetti({
        particleCount: 120,
        spread: 100,
        origin: { y: 0.55 },
        colors: colors,
      });
    }, 300);

    // Increase floating hearts
    for (let i = 0; i < 12; i++) setTimeout(createHeart, i * 200);
  }
</script>

</body>
</html>
